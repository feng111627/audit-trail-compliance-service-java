server.port=0

# ========== 审计留痕配置 ==========
# 总开关
audit.enabled=true
# 留存天数：超过该时长的数据按 purge-mode 处理
audit.retention.days=90
# 过期处理方式：DELETE=物理删除；ANONYMIZE=匿名化（actor 置为 deleted@retention、参数清空，记录骨架保留）
audit.retention.purge-mode=DELETE
# 定时清理表达式（默认每天 02:30）
audit.retention.cron=0 30 2 * * *
# 是否在应用启动时执行一次清理（本地验证可临时打开）
audit.retention.purge-on-startup=false
