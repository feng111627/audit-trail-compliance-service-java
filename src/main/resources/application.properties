server.port=0

# ===== 审计留痕配置 =====
# 审计开关
audit.enabled=true
# 留存天数：超过该天数的审计数据在定时清理时物理删除；<=0 表示永久留存
audit.retention-days=90
# 过期数据清理 cron（默认每天凌晨 2 点）
audit.purge-cron=0 0 2 * * ?
# 允许查询/导出审计数据的角色（逗号分隔）；其他角色越权将被明确拒绝
audit.query-roles=AUDITOR,ADMIN

# 异步任务线程池（@Async 审计上下文通过 AuditTaskDecorator 自动透传）
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.thread-name-prefix=audit-async-
